# ABOUTME: Builds the Instruqt sandbox image and pushes it to GHCR.
# main publishes :latest, which instruqt/config.yml pulls; other branches publish a branch tag.
name: Sandbox image

on:
  push:
    paths-ignore:
      - "instruqt/**"
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/keycard-sandbox/keycard-temporal-workshop-sandbox
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "branch=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${IMAGE}:$(echo "$REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.branch }}
            ${{ env.IMAGE }}:${{ github.sha }}
