version: "3"
containers:
- name: workshop
  # Pinned to a tested build: the tag is the commit SHA CI built it from.
  # To ship a new image, verify the build on a lab, then update this tag.
  image: ghcr.io/keycardai/keycard-temporal-workshop-sandbox:b592db85e26b8bf29e71ccceb4fb89180d06c54f
  shell: /bin/bash
  memory: 4096
  ports:
  - 8400   # Expense Desk preview (Caddy forwards to 127.0.0.1:8400)
  - 8233   # Temporal UI
# Values are set in the Instruqt team settings (`instruqt secrets`). They reach
# lifecycle scripts only; track_scripts/setup-workshop writes them into the .env files.
secrets:
- name: KEYCARD_WORKSHOP_LLM_API_KEY
- name: KEYCARD_WORKSHOP_LEDGER_API_KEY
- name: KEYCARD_WORKSHOP_MCP_CLIENT_ID
- name: KEYCARD_WORKSHOP_MCP_CLIENT_SECRET
- name: KEYCARD_WORKSHOP_WORKER_CLIENT_ID
- name: KEYCARD_WORKSHOP_WORKER_CLIENT_SECRET
