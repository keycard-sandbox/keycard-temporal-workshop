title: Secure Agents with Keycard and Temporal
teaser: Take an expense agent from a shared API key to verified identity, then watch
  Temporal finish a settlement after its worker dies.
description: |-
  Expense Desk is an AI agent that files and approves expenses through an MCP server and a shared Ledger API. It starts with one shared API key, so nobody can tell who did what.

  - Exercise 01: submit and review expenses with the shared key, then try to work out who approved what.
  - Exercise 02: register your agent in Keycard and switch it to application identity.
  - Exercise 03: sign in, approve a partner's expense, and watch self-approval get refused.
  - Exercise 04: run a Temporal settlement workflow, kill its worker mid-run, restart it, and confirm no credentials landed in workflow history.

  Expense Desk, the MCP server, and a Temporal dev server run inside your sandbox. Exercises 02 and 03 need a GitHub account for Keycard sign-in.
